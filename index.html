<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Metadata and configuration -->
  <meta charset="UTF-8" /> <!-- Ensures proper character encoding -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Makes the page responsive -->

  <!-- Page Title -->
  <title>Tic Tac Toe</title>

  <!-- External CSS for styling -->
  <link rel="stylesheet" href="style.css" />

  <!-- JavaScript file loaded after the page is parsed -->
  <script src="script.js" defer></script>
</head>
<body>
    <!-- Main container -->
    <div id="wrapper">
        <!-- Page heading -->
        <h1>Tic Tac Toe</h1>

        <!-- Gameboard where cells will be dynamically inserted -->
        <div id="gameboard"></div>

        <!-- Button to reset the game state -->
        <button id="reset-button">Reset Game</button>

        <!-- Message display area (e.g., win/draw notifications) -->
        <div id="message"></div>
    </div>      
</body>
</html>
